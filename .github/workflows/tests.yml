name: Testes

# Regressões sem rede e sem IA (banco temporário) — roda a cada push/PR na main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  regressoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Roda os testes de regressão
        run: python tests/test_regressions.py
